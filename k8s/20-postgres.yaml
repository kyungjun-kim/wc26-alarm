# 개발/데모용 Postgres. 운영에선 관리형 DB나 오퍼레이터 사용 권장.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: wc26
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: wc26
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: wc26 }
            - { name: POSTGRES_PASSWORD, value: wc26 }
            - { name: POSTGRES_DB, value: wc26 }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "wc26"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wc26
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
