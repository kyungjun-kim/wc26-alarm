# 서빙: FastAPI Deployment + Service.
# 이미지는 docker/app.Dockerfile 로 빌드 후 레지스트리에 푸시한 태그로 교체.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wc26
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: wc26-alarm-app:latest   # kind load / 레지스트리 푸시 후 교체
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: wc26-config }
            - secretRef: { name: wc26-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wc26
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8000
