<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wc26-alarm · 오늘 밤 뭘 챙겨봐야 하나?</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    p.sub { color: #888; margin-top: 0; }
    nav { display: flex; align-items: center; gap: .5rem; margin: 1rem 0; }
    nav button { font: inherit; padding: .35rem .7rem; border: 1px solid #8886; border-radius: .4rem;
                 background: transparent; color: inherit; cursor: pointer; }
    nav button:hover { background: #8882; }
    nav .date { flex: 1; text-align: center; font-weight: 600; }
    nav .date .dow { color: #888; font-weight: 400; margin-left: .4rem; }
    nav button.today { margin-left: .25rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid #8884; }
    .time { font-variant-numeric: tabular-nums; color: #888; min-width: 5.5rem; }
    .teams { flex: 1; font-weight: 600; }
    .label { font-size: .9rem; white-space: nowrap; }
    .xg { font-size: .8rem; color: #888; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .score { font-variant-numeric: tabular-nums; min-width: 2.5rem; text-align: right; color: #888; }
    .empty { color: #888; padding: 2rem 0; }
  </style>
</head>
<body>
  <h1>⚽ 오늘 밤, 뭘 챙겨봐야 하나?</h1>
  <p class="sub">2026 월드컵 · 한국 시간(KST) 기준 · 점수 높은 순</p>

  <nav>
    <button id="prev" aria-label="이전 날">◀</button>
    <span class="date" id="dateLabel">—</span>
    <button id="next" aria-label="다음 날">▶</button>
    <button id="today" class="today">오늘</button>
  </nav>

  <ul id="list"><li class="empty">불러오는 중…</li></ul>

  <script>
    // KST 기준 오늘 날짜(YYYY-MM-DD)
    function kstToday() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
      }).format(new Date());
    }
    // YYYY-MM-DD 에 일수를 더한 새 날짜 (UTC 정오 기준으로 계산해 TZ 경계 회피)
    function addDays(ymd, n) {
      const d = new Date(ymd + "T12:00:00Z");
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function fmtDateLabel(ymd) {
      const d = new Date(ymd + "T12:00:00Z");
      const date = d.toLocaleDateString("ko-KR", { timeZone: "UTC", month: "long", day: "numeric" });
      const dow = d.toLocaleDateString("ko-KR", { timeZone: "UTC", weekday: "short" });
      return `${date}<span class="dow">(${dow})</span>`;
    }
    function fmtTime(iso) {
      // kst_kickoff 는 KST 벽시계 시각이므로 변환 없이 HH:MM 만 표시
      return iso.slice(11, 16);
    }

    let current = kstToday();

    async function load() {
      const list = document.getElementById("list");
      document.getElementById("dateLabel").innerHTML = fmtDateLabel(current);
      document.getElementById("today").disabled = current === kstToday();
      list.innerHTML = '<li class="empty">불러오는 중…</li>';
      try {
        const res = await fetch(`/api/day/${current}`);
        const data = await res.json();
        if (!data.matches.length) {
          list.innerHTML = '<li class="empty">이 날짜에 예정된 경기가 없습니다.</li>';
          return;
        }
        list.innerHTML = data.matches.map((m) => {
          const xg = (m.home_xg != null && m.away_xg != null)
            ? `<span class="xg">xG ${m.home_xg.toFixed(1)}–${m.away_xg.toFixed(1)}</span>` : "";
          return `
          <li>
            <span class="time">${fmtTime(m.kst_kickoff)}</span>
            <span class="teams">${m.home_team ?? "?"} vs ${m.away_team ?? "?"}</span>
            ${xg}
            <span class="label">${m.label ?? ""}</span>
            <span class="score">${m.score ?? "-"}</span>
          </li>`;
        }).join("");
      } catch (e) {
        list.innerHTML = `<li class="empty">불러오기 실패: ${e}</li>`;
      }
    }

    document.getElementById("prev").onclick = () => { current = addDays(current, -1); load(); };
    document.getElementById("next").onclick = () => { current = addDays(current, 1); load(); };
    document.getElementById("today").onclick = () => { current = kstToday(); load(); };
    load();
  </script>
</body>
</html>
