<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wc26-alarm · 오늘 밤 뭘 챙겨봐야 하나?</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    p.sub { color: #888; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid #8884; }
    .time { font-variant-numeric: tabular-nums; color: #888; min-width: 5.5rem; }
    .teams { flex: 1; font-weight: 600; }
    .label { font-size: .9rem; white-space: nowrap; }
    .xg { font-size: .8rem; color: #888; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .score { font-variant-numeric: tabular-nums; min-width: 2.5rem; text-align: right; color: #888; }
    .empty { color: #888; padding: 2rem 0; }
  </style>
</head>
<body>
  <h1>⚽ 오늘 밤, 뭘 챙겨봐야 하나?</h1>
  <p class="sub">2026 월드컵 · 한국 시간(KST) 기준 · 점수 높은 순</p>
  <ul id="list"><li class="empty">불러오는 중…</li></ul>

  <script>
    function fmtKst(iso) {
      const d = new Date(iso);
      return d.toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false,
      });
    }
    async function load() {
      const list = document.getElementById("list");
      try {
        const res = await fetch("/api/tonight?hours=48");
        const data = await res.json();
        if (!data.matches.length) {
          list.innerHTML = '<li class="empty">향후 48시간 내 예정 경기가 없습니다.</li>';
          return;
        }
        list.innerHTML = data.matches.map((m) => {
          const xg = (m.home_xg != null && m.away_xg != null)
            ? `<span class="xg">xG ${m.home_xg.toFixed(1)}–${m.away_xg.toFixed(1)}</span>` : "";
          return `
          <li>
            <span class="time">${fmtKst(m.kst_kickoff)}</span>
            <span class="teams">${m.home_team ?? "?"} vs ${m.away_team ?? "?"}</span>
            ${xg}
            <span class="label">${m.label ?? ""}</span>
            <span class="score">${m.score ?? "-"}</span>
          </li>`;
        }).join("");
      } catch (e) {
        list.innerHTML = `<li class="empty">불러오기 실패: ${e}</li>`;
      }
    }
    load();
  </script>
</body>
</html>
